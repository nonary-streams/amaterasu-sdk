[workspace]
resolver = "2"
members = ["crates/abi", "crates/contracts", "crates/module-sdk", "crates/media"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-abi = { path = "crates/abi" }
amaterasu-contracts = { path = "crates/contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
