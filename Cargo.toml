[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/configuration-schema",
    "crates/contracts",
    "crates/data-plane",
    "crates/extension-api",
    "crates/media",
    "crates/module-sdk",
    "crates/network-api",
    "crates/network-sockets",
    "crates/storage",
    "crates/windows-capture-geometry",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
amaterasu-abi = { path = "crates/abi" }
amaterasu-configuration-schema = { path = "crates/configuration-schema" }
amaterasu-contracts = { path = "crates/contracts" }
amaterasu-data-plane = { path = "crates/data-plane" }
amaterasu-extension-api = { path = "crates/extension-api" }
amaterasu-media = { path = "crates/media" }
amaterasu-module-sdk = { path = "crates/module-sdk" }
amaterasu-network-api = { path = "crates/network-api" }
amaterasu-network-sockets = { path = "crates/network-sockets" }
amaterasu-storage = { path = "crates/storage" }
amaterasu-windows-capture-geometry = { path = "crates/windows-capture-geometry" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
