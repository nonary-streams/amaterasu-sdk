name: Release

# Pushing a tag such as v0.2.0 checks the workspace on every platform and
# publishes the tagged source as a release. Module repositories pin the SDK by
# commit in their sdk-revision file; a release names a commit worth pinning.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag against the workspace version
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [ "$version" = "${GITHUB_REF_NAME#v}" ] || {
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "Pin this SDK with \`$(git rev-parse HEAD)\` in a module's \`sdk-revision\`."
