[package]
name = "example-application-library-v2"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
# Suppress the exported ABI symbol when embedded by a composition test.
embedded = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amaterasu-module-sdk = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
