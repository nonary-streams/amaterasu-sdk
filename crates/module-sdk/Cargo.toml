[package]
name = "amaterasu-module-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
network-test-support = ["dep:amaterasu-network-sockets"]
network-http = ["dep:ureq"]
process = ["dep:amaterasu-process-api"]

[dependencies]
amaterasu-timing-metrics.workspace = true
base64 = "0.22"
amaterasu-abi.workspace = true
amaterasu-network-api.workspace = true
amaterasu-process-api = { workspace = true, optional = true }
amaterasu-network-sockets = {workspace = true, optional = true}
amaterasu-data-plane.workspace = true
getrandom.workspace = true
amaterasu-contracts.workspace = true
amaterasu-extension-api = { path = "../extension-api" }
amaterasu-media.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"], optional = true }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
libloading.workspace = true
amaterasu-module-testkit.workspace = true
